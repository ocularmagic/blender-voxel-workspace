[project]
name = "voxel-workspace"
version = "0.1.0"
description = "A Blender 5.1 extension for authoring bounded voxel volumes"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

dependencies = []

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "performance: workstation performance checks",
]
